<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Login - Nitya Clinic</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="navbar">
        <div class="logo">
            <div class="logo-icon">🏥</div>
            <div>
                <h1>Nitya Clinic</h1>
                <p>Dr. Nitya - MBBS &nbsp;|&nbsp; General Physician</p>
            </div>
        </div>
        <div class="nav-links">
            <a href="patient-login.html" class="active">Patient Login</a>
            <a href="doctor-login.html">Doctor Login</a>
        </div>
    </div>

    <div class="login-container">
        <div class="login-box">
            <div class="clinic-badge">
                <span class="badge">🩺 Patient Login</span>
            </div>
            <h2>Welcome to Nitya Clinic</h2>
            <p class="subtitle">Login to book your appointment</p>

            <div class="error-message" id="errorMsg"></div>
            <div class="success-message" id="successMsg"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" placeholder="Enter your full name" required>
                </div>
                <div class="form-group">
                    <label for="mobile">Mobile Number</label>
                    <input type="tel" id="mobile" placeholder="10-digit mobile number" pattern="[0-9]{10}" maxlength="10" required>
                </div>
                <button type="submit" class="btn btn-primary">Login</button>
            </form>

            <div class="form-footer">
                <a href="doctor-login.html">Are you the doctor? Click here</a>
            </div>
        </div>
    </div>

    <div class="footer">
        <p>© 2026 Nitya Clinic | Dr. Nitya (MBBS) | All Rights Reserved</p>
    </div>

    <script src="js/patient-login.js"></script>
</body>
</html>
